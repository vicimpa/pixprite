name: CI

# Builds and deploys the editor. Changes that can't affect it don't start a build:
# extensions are published by extensions.yml, docs and texts are not part of the build
on:
  push:
    branches: [ main ]
    paths-ignore: &unrelated
      - 'extensions/**'
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/workflows/extensions.yml'
      - 'scripts/build-extensions.ts'
      - 'scripts/extensions.ts'
      - 'scripts/check-versions.ts'
      - '.vscode/**'
      - '.gitignore'
  pull_request:
    paths-ignore: *unrelated

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: |
          bun install 

      - name: Build
        run: |
          bun run build
          
      - name: Deploy
        if: github.event_name == 'push'
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages 
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}