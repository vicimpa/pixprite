name: Extensions

permissions:
  contents: read

# The editor's build has no extensions: they are published on their own, to the orphan branch
# `extensions` (the public catalog, read through jsDelivr). Only `"public": false` ones stay out.
on:
  push:
    branches: [ main ]
    paths:
      - 'extensions/**'
      - 'scripts/extensions.ts'
      - 'scripts/build-extensions.ts'
      - 'scripts/publish-extensions.ts'
      - 'src/core/extensions/versions.ts'
      - 'packages/api/src/types.ts'
      - 'src/core/extensions/manifest.ts'
      - 'src/core/extensions/iconPack.ts'
      - '.github/workflows/extensions.yml'
  pull_request:
    paths:
      - 'extensions/**'
      - 'scripts/extensions.ts'
      - 'scripts/build-extensions.ts'
      - 'scripts/publish-extensions.ts'
      - 'src/core/extensions/versions.ts'
      - 'packages/api/src/types.ts'
      - 'src/core/extensions/manifest.ts'
      - 'src/core/extensions/iconPack.ts'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      # Manifests, sources, locales and %key% references
      - name: Check
        run: bun scripts/build-extensions.ts

      - name: Publication tests
        run: bun test scripts/extension-publication.test.ts scripts/extension-artifacts.test.ts

      # A changed public extension needs a new version, or installed copies never update
      - name: Versions
        if: github.event_name == 'pull_request'
        run: bun scripts/check-versions.ts origin/${{ github.base_ref }}

  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: extensions-branch
      cancel-in-progress: false
    env:
      CDN: https://cdn.jsdelivr.net/gh/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      - name: Open the extensions branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin extensions >/dev/null; then
            git fetch origin extensions
            git worktree add -B extensions pub origin/extensions
          else
            git worktree add --orphan -b extensions pub
          fi

      # Package bytes are pinned to a source commit; tags keep each package version discoverable.
      - name: Publish versioned packages
        run: |
          bun scripts/publish-extensions.ts --worktree pub --cdn "$CDN" --source "$GITHUB_SHA"
          git -C pub push --atomic origin extensions 'refs/tags/ext-*:refs/tags/ext-*'

      # The branch url is cached by jsDelivr for hours; the pinned package paths need nothing
      - name: Refresh the CDN
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@extensions/registry.json" || true
