[package]
name = "pixprite"
version = "0.0.2"
description = "Pixel art and animation editor"
authors = ["vicimpa"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[profile.release]
# Keep distributables small; debug builds retain their default profile.
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11.6", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "fs", "io-util"] }
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
dirs = "6"
open = "5"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }

objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences"] }
